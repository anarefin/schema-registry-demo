name: Schema Governance Bootstrap

# Fresh v1 reset (spec code-first D4 / T-4.2). Run this ONCE per new registry environment to
# (1) re-seed every contract artifact from its committed generated schema, and
# (2) re-attach the FORWARD compatibility rule to each.
#
# All artifacts are JSON Schema and use FORWARD — in Apicurio's JSON Schema checker, adding an
# optional property is classified as a "narrowing" and is only FORWARD-compatible, never BACKWARD
# (see README §2).
#
# Data-driven: artifact coordinates are DISCOVERED from each *-contracts/apicurio-artifacts.json
# (see .github/scripts/discover-contract-artifacts.sh). Adding a new event only requires updating
# that catalog + build.gradle artifact list — bootstrap cannot drift. It is safe to re-run:
# `registerSchemas` is idempotent (FIND_OR_CREATE_VERSION) and Apicurio returns 409 if a rule
# already exists, which this workflow treats as success.
#
# Runs on the SELF-HOSTED runner so it can reach the standing local registry at
# http://localhost:8080 (the default below). The host cold-start step (README §2) already performs
# this reset after `docker compose up`; this workflow is the manual/explicit equivalent.
#
# Usage: Actions → Schema Governance Bootstrap → Run workflow
#        Optionally override the registry URL via the input.

on:
  workflow_dispatch:
    inputs:
      registry_url:
        description: 'Apicurio registry URL (leave blank to use the standing local registry)'
        required: false
        default: ''

env:
  # Resolve the registry URL once. Using env: (not inline in run:) means the ${{ }} interpolation
  # sets a variable rather than being evaluated by the shell — this prevents command injection via
  # the registry_url input.
  REGISTRY_URL: ${{ github.event.inputs.registry_url || 'http://localhost:8080' }}

jobs:
  bootstrap:
    name: Re-seed v1 + attach FORWARD rules
    runs-on: [self-hosted, apicurio-local]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Discover contract modules
        id: modules
        run: |
          TASKS=$(for d in *-contracts; do [ -f "$d/build.gradle" ] && echo ":$d:registerSchemas"; done | sort | tr '\n' ' ')
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Discovered registerSchemas tasks: $TASKS"

      - name: Discover contract artifacts
        id: artifacts
        # Single source of truth: same apicurio-artifacts.json catalogs that registerSchemas uses.
        run: |
          ARTIFACTS=$(.github/scripts/discover-contract-artifacts.sh)
          COUNT=$(printf '%s\n' "${ARTIFACTS}" | grep -c . || true)
          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: no artifacts discovered from *-contracts catalogs" >&2
            exit 1
          fi
          {
            echo "list<<EOF"
            printf '%s\n' "${ARTIFACTS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Discovered ${COUNT} artifacts:"
          printf '%s\n' "${ARTIFACTS}"

      - name: Re-seed v1 — register every contract schema
        # Idempotent (FIND_OR_CREATE_VERSION + canonicalize). Seeds all contract artifacts from
        # their committed generated schemas before the rules are attached.
        run: |
          ./gradlew ${{ steps.modules.outputs.tasks }} \
            -Papicurio.registry.url="${REGISTRY_URL}" \
            --no-daemon

      - name: Attach FORWARD compatibility rules
        # Loop discovered artifacts. JSON Schema: adding an optional property is
        # FORWARD-compatible in Apicurio (BACKWARD rejects it as OBJECT_TYPE_PROPERTY_SCHEMAS_NARROWED).
        # Here-string (<<<) keeps the loop in the current shell so a failing `exit 1` fails the step
        # (a piped `while` would run in a subshell and swallow the exit).
        env:
          ARTIFACTS: ${{ steps.artifacts.outputs.list }}
        run: |
          while IFS='/' read -r GROUP ARTIFACT; do
            [ -z "${GROUP}" ] && continue
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${REGISTRY_URL}/apis/registry/v3/groups/${GROUP}/artifacts/${ARTIFACT}/rules" \
              -H 'Content-Type: application/json' \
              -d '{"ruleType":"COMPATIBILITY","config":"FORWARD"}')
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ] || [ "$STATUS" = "409" ]; then
              echo "${GROUP}/${ARTIFACT}: FORWARD rule attached (HTTP $STATUS)"
            else
              echo "ERROR: unexpected HTTP $STATUS for ${GROUP}/${ARTIFACT}" >&2
              exit 1
            fi
          done <<< "${ARTIFACTS}"

      - name: Verify rules are active
        env:
          ARTIFACTS: ${{ steps.artifacts.outputs.list }}
        run: |
          while IFS='/' read -r GROUP ARTIFACT; do
            [ -z "${GROUP}" ] && continue
            echo "=== ${GROUP}/${ARTIFACT} rules ==="
            curl -sf "${REGISTRY_URL}/apis/registry/v3/groups/${GROUP}/artifacts/${ARTIFACT}/rules" | cat
            echo ""
          done <<< "${ARTIFACTS}"
