name: Schema Compatibility Check

# Runs on every PR that touches a schema contract module.
# Executes on a SELF-HOSTED runner that shares a machine with the standing Apicurio registry
# (docker compose), reachable at http://localhost:8080. The check is READ-ONLY: Gradle
# `compatCheckSchemas` dry-runs version create against the registry without writing anything.
#
# Prereqs (see docs/self-hosted-runner-setup.md):
#   - `docker compose up -d` is running on the runner host (registry healthy; the host cold-start
#     step in README §2 has seeded all seven artifacts + their FORWARD compatibility rules — all
#     JSON Schema artifacts).
#   - the runner is labelled `apicurio-local` and has JDK 25.
#
# Data-driven: the module list is DISCOVERED from every `*-contracts` directory that carries a
# build.gradle, so adding a new domain (e.g. `shipping-contracts`) needs no workflow edit.

on:
  pull_request:
    paths:
      - '*-contracts/**'

env:
  REGISTRY_URL: http://localhost:8080

jobs:
  compat-check:
    name: Compatibility check (all contract modules)
    runs-on: [self-hosted, apicurio-local]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Discover contract modules
        id: modules
        run: |
          TASKS=$(for d in *-contracts; do [ -f "$d/build.gradle" ] && echo ":$d:compatCheckSchemas"; done | sort | tr '\n' ' ')
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Discovered compatCheckSchemas tasks: $TASKS"

      - name: Run compatibility check (dry-run, no writes)
        run: |
          ./gradlew ${{ steps.modules.outputs.tasks }} \
            -Papicurio.registry.url=${REGISTRY_URL} \
            --no-daemon
