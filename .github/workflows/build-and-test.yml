name: Build and Test

# Runs unit tests (*Test) on every PR and on pushes to main.
# No Testcontainers / integrationTest here — use workflow_dispatch or local `./gradlew check`
# for *IT. Schema governance stays in the schema-* workflows (incl. self-hosted
# Apicurio runner for compat/register).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_verify:
        description: 'Also run integration tests (./gradlew check)'
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit tests (./gradlew test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test --no-daemon

  integration-tests:
    name: Integration tests (./gradlew check)
    if: github.event_name == 'workflow_dispatch' && inputs.run_verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run check (unit + Testcontainers ITs)
        run: ./gradlew check --no-daemon
