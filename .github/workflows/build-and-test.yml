name: Build and Test

# Runs unit tests (Surefire, *Test.java) on every PR and on pushes to main.
# No Testcontainers / Failsafe here — use workflow_dispatch or local `./mvnw verify`
# for *IT.java. Schema governance stays in the schema-* workflows (incl. self-hosted
# Apicurio runner for compat/register).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_verify:
        description: 'Also run Failsafe integration tests (./mvnw verify)'
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit tests (./mvnw test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Write toolchains.xml (Temurin)
        # Parent POM requires maven-toolchains-plugin with a JDK 25 entry; CI has no
        # pre-existing ~/.m2/toolchains.xml. Point jdkHome at the setup-java install.
        run: |
          mkdir -p "$HOME/.m2"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<toolchains>' \
            '  <toolchain>' \
            '    <type>jdk</type>' \
            '    <provides>' \
            '      <version>25</version>' \
            '    </provides>' \
            '    <configuration>' \
            "      <jdkHome>${JAVA_HOME}</jdkHome>" \
            '    </configuration>' \
            '  </toolchain>' \
            '</toolchains>' \
            > "$HOME/.m2/toolchains.xml"

      - name: Run unit tests
        run: ./mvnw test --no-transfer-progress

  integration-tests:
    name: Integration tests (./mvnw verify)
    if: github.event_name == 'workflow_dispatch' && inputs.run_verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Write toolchains.xml (Temurin)
        run: |
          mkdir -p "$HOME/.m2"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<toolchains>' \
            '  <toolchain>' \
            '    <type>jdk</type>' \
            '    <provides>' \
            '      <version>25</version>' \
            '    </provides>' \
            '    <configuration>' \
            "      <jdkHome>${JAVA_HOME}</jdkHome>" \
            '    </configuration>' \
            '  </toolchain>' \
            '</toolchains>' \
            > "$HOME/.m2/toolchains.xml"

      - name: Run verify (unit + Testcontainers ITs)
        run: ./mvnw verify --no-transfer-progress
