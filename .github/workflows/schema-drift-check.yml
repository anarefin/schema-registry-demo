name: Schema Drift Check

# Offline gate: regenerates the JSON Schema from the Java Record and fails if the committed
# artifact differs. Runs without a registry — pure local Maven build.
#
# Catches: POJO annotation changes that weren't followed by a schema regeneration + commit.

on:
  pull_request:
    paths:
      - 'payment-contracts/**'

jobs:
  drift-check:
    name: Drift check (payment-contracts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Regenerate schema
        run: ./mvnw -pl payment-contracts process-classes --no-transfer-progress

      - name: Fail if schema differs from committed artifact
        run: git diff --exit-code -- payment-contracts/src/main/resources/schemas/
