name: Schema Drift Check

# Offline gate: regenerates every JSON Schema from its Java Record (each contracts module owns its
# own generation via the shared build-only `schema-gen-tools` jar, ADR-0003) and fails if any
# committed artifact differs. Runs without a registry — pure local Gradle build.
#
# Catches: record/annotation changes that weren't followed by a schema regeneration + commit.
#
# Data-driven: contract modules are DISCOVERED from every top-level `*-contracts` directory that
# carries a build.gradle (same pattern as schema-compat-check / schema-register), so adding a new
# domain needs no workflow edit. The schema diff glob already covers every `*-contracts` schemas dir.

on:
  pull_request:
    paths:
      - '*-contracts/**'
      - 'schema-gen-tools/**'
      - '.github/scripts/**'
      - '.github/workflows/schema-governance-bootstrap.yml'
      - '.github/workflows/schema-drift-check.yml'

jobs:
  drift-check:
    name: Drift check (all contract modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify bootstrap artifact discovery
        # Same apicurio-artifacts.json catalogs the governance bootstrap workflow consumes.
        run: .github/scripts/discover-contract-artifacts_test.sh

      - name: Discover contract modules
        id: modules
        run: |
          TASKS=$(for d in *-contracts; do [ -f "$d/build.gradle" ] && echo ":$d:generateSchemas"; done | sort | tr '\n' ' ')
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "Discovered generateSchemas tasks: $TASKS"

      - name: Regenerate all schemas
        # Each contracts module's generateSchemas task invokes schema-gen-tools against its
        # own records (ADR-0003); Gradle builds schema-gen-tools first via task dependencies.
        env:
          GENERATE_TASKS: ${{ steps.modules.outputs.tasks }}
        run: ./gradlew $GENERATE_TASKS --no-daemon

      - name: Fail if any schema differs from its committed artifact
        run: git diff --exit-code -- '*-contracts/src/main/resources/schemas/*'
