name: Schema Drift Check

# Offline gate: regenerates every JSON Schema from its Java Record (via the shared build-only
# `schema-gen-tools` module) and fails if any committed artifact differs. Runs without a registry —
# pure local Maven build.
#
# Catches: record/annotation changes that weren't followed by a schema regeneration + commit.
#
# Data-driven: `schema-gen-tools` regenerates every target listed in GeneratedSchemas.ALL, writing
# into each owning contract module's src/main/resources/schemas/. Adding a domain needs no edit
# here — the diff globs every `*-contracts` schemas dir.

on:
  pull_request:
    paths:
      - '*-contracts/**'
      - 'schema-gen-tools/**'

jobs:
  drift-check:
    name: Drift check (all contract modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Regenerate all schemas
        # `-am` also-builds the contract modules the generator depends on; the exec-maven-plugin
        # bound to process-classes writes every schema into its owning contract module.
        run: ./mvnw -pl schema-gen-tools -am process-classes --no-transfer-progress

      - name: Fail if any schema differs from its committed artifact
        run: git diff --exit-code -- '*-contracts/src/main/resources/schemas/*'
