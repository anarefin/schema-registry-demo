name: Schema Drift Check

# Offline gate: regenerates every JSON Schema from its Java Record (each contracts module owns its
# own generation via the shared build-only `schema-gen-tools` jar, ADR-0003) and fails if any
# committed artifact differs. Runs without a registry — pure local Maven build.
#
# Catches: record/annotation changes that weren't followed by a schema regeneration + commit.
#
# Data-driven: contract modules are DISCOVERED from every top-level `*-contracts` directory that
# carries a pom.xml (same pattern as schema-compat-check / schema-register), so adding a new
# domain needs no workflow edit. The schema diff glob already covers every `*-contracts` schemas dir.

on:
  pull_request:
    paths:
      - '*-contracts/**'
      - 'schema-gen-tools/**'
      - '.github/scripts/**'
      - '.github/workflows/schema-governance-bootstrap.yml'
      - '.github/workflows/schema-drift-check.yml'

jobs:
  drift-check:
    name: Drift check (all contract modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Write toolchains.xml (Temurin)
        run: |
          mkdir -p "$HOME/.m2"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<toolchains>' \
            '  <toolchain>' \
            '    <type>jdk</type>' \
            '    <provides>' \
            '      <version>25</version>' \
            '    </provides>' \
            '    <configuration>' \
            "      <jdkHome>${JAVA_HOME}</jdkHome>" \
            '    </configuration>' \
            '  </toolchain>' \
            '</toolchains>' \
            > "$HOME/.m2/toolchains.xml"

      - name: Verify bootstrap artifact discovery
        # Same POM <artifacts> list the governance bootstrap workflow consumes — fails if
        # discovery drifts from the known seven order + customer coordinates.
        run: .github/scripts/discover-contract-artifacts_test.sh

      - name: Discover contract modules
        id: modules
        run: |
          PL=$(for d in *-contracts; do [ -f "$d/pom.xml" ] && echo "$d"; done | sort | paste -sd, -)
          echo "pl=$PL" >> "$GITHUB_OUTPUT"
          echo "Discovered contract modules: $PL"

      - name: Regenerate all schemas
        # Each contracts module's own process-classes phase invokes schema-gen-tools against its
        # own records (ADR-0003); -am also builds schema-gen-tools itself first.
        env:
          CONTRACT_MODULES: ${{ steps.modules.outputs.pl }}
        run: ./mvnw -pl "$CONTRACT_MODULES" -am process-classes --no-transfer-progress

      - name: Fail if any schema differs from its committed artifact
        run: git diff --exit-code -- '*-contracts/src/main/resources/schemas/*'
