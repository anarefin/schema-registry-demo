spring:
  application:
    name: producer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

# Local demo: poison DLQ drill (off by default; forced off under prod profile below).
events:
  demo:
    poison-endpoint: true

# T-6.5: Actuator — expose health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

---
# T-6.4: Structured JSON logging for prod profile (Spring Boot 4.0 native)
spring:
  config:
    activate:
      on-profile: prod
  application:
    name: producer-service
events:
  demo:
    poison-endpoint: false
logging:
  structured:
    format:
      console: ecs
