spring:
  application:
    name: producer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

apicurio:
  registry:
    url: ${APICURIO_REGISTRY_URL:http://localhost:8080}
  # Schema cache tuning (defaults shown). ttl drives how quickly the producer's 'latest'
  # coordinate picks up a newly registered version.
  cache:
    max-size: 1000
    ttl: 5m
    refresh-after-write: 1m

# Producer only publishes; it does not declare consumer-side retry/DLQ infrastructure.
schema-messaging:
  consumer:
    enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
