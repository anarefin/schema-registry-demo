spring:
  application:
    name: producer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

# Spec 09 / ARCH-001: pure producer — no @BitsEventHandler methods, so gate out the
# consumer listener stack (DlxMessageRecoverer, DlxRoutingAdvice, rabbitListenerContainerFactory,
# BitsEventHandlerRegistrar). RabbitAdmin stays available for exchange declaration.
events:
  consumer:
    enabled: false

# T-6.5: Actuator — expose health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always

---
# T-6.4: Structured JSON logging for prod profile (Spring Boot 4.0 native)
spring:
  config:
    activate:
      on-profile: prod
  application:
    name: producer-service
logging:
  structured:
    format:
      console: ecs
