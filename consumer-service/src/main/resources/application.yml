spring:
  application:
    name: consumer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

apicurio:
  registry:
    url: ${APICURIO_REGISTRY_URL:http://localhost:8080}
  # Schema cache tuning (these are the defaults — shown for tunability). ttl drives how quickly
  # a 'latest' coordinate picks up a newly registered version; refresh-after-write does an async
  # stale-while-revalidate reload. The globalId cache is immutable and is size-bounded only.
  cache:
    max-size: 1000
    ttl: 5m
    refresh-after-write: 1m

# Consumer declares the events/DLX/retry topology and runs the schema-aware listener factory.
schema-messaging:
  consumer:
    enabled: true

# Single 5s retry tier, cycled up to max-attempts times before a transient failure hits the DLQ.
events:
  retry:
    tier:
      ms: 5000
    max-attempts: 3

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
