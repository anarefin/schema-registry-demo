spring:
  application:
    name: consumer-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

# T-6.5: Actuator — expose health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

---
# T-6.4: Structured JSON logging for prod profile (Spring Boot 4.0 native)
spring:
  config:
    activate:
      on-profile: prod
  application:
    name: consumer-service
logging:
  structured:
    format:
      console: ecs
