# Phase 0 infrastructure (T-0.7 / T-0.8): Postgres, Apicurio Registry (+ UI), RabbitMQ.
# Every service has a healthcheck; dependents wait on `service_healthy` for cold-start ordering.
services:
  postgres:
    image: postgres:17
    # Standing registry backend: persist data so registered schema versions survive restarts
    # (this registry is the baseline the self-hosted CI compat-check reads against).
    restart: unless-stopped
    environment:
      POSTGRES_USER: apicurio
      POSTGRES_PASSWORD: apicurio
      POSTGRES_DB: apicurio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicurio -d apicurio"]
      interval: 5s
      timeout: 5s
      retries: 10

  apicurio:
    image: apicurio/apicurio-registry:3.2.0
    # Always-on so the self-hosted runner can reach it at http://localhost:8080 across reboots.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # SQL storage backed by Postgres (spec §8).
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD: apicurio
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/registry/v3/system/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  apicurio-ui:
    image: apicurio/apicurio-registry-ui:3.2.0
    restart: unless-stopped
    depends_on:
      apicurio:
        condition: service_healthy
    environment:
      REGISTRY_API_URL: http://localhost:8080/apis/registry/v3
    ports:
      - "8888:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # producer-service/consumer-service images are built from the jar already produced by a host
  # `./gradlew build` — no Gradle toolchain runs inside these Dockerfiles (same "single-source
  # build" principle applied to schema registration below). Run `./gradlew build -x test`
  # once before `docker compose up --build`.
  producer-service:
    build:
      context: ./producer-service
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  consumer-service:
    build:
      context: ./consumer-service
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Schema registration is a host-Gradle step (not a compose service): once Apicurio is healthy,
  # register both contracts and attach their compatibility rules from the host —
  #   ./gradlew registerSchemas -Papicurio.registry.url=http://localhost:8080
  # then POST the COMPATIBILITY rules — FORWARD for all seven artifacts
  # (JSON property additions only validate under FORWARD; see README §2) — or run the
  # "Schema Governance Bootstrap" GitHub workflow. Registration uses buildSrc Apicurio
  # Registry v3 REST tasks — no separate registry client container is needed.

# Named volume backing the standing Apicurio registry's Postgres data. Survives
# `docker compose restart`/recreate; removed only on `docker compose down -v`.
volumes:
  pgdata:
