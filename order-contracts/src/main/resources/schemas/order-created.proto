syntax = "proto3";

package com.example.contracts.orders;

option java_package = "com.example.contracts.orders";
option java_outer_classname = "OrderCreatedProto";
option java_multiple_files = true;

message OrderCreated {
  int64  order_id    = 1;
  string customer_id = 2;
  string product_id  = 3;
  int32  quantity    = 4;
  double total_amount = 5;
  string currency    = 6;
  string created_at  = 7;
  // v2: optional promo code applied to the order (BACKWARD-compatible addition — field 8).
  // 'optional' enables field presence (hasPromoCode()) per proto3 field tracking.
  optional string promo_code  = 8;
}
