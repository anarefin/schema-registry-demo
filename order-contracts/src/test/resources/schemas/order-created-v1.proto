syntax = "proto3";

package com.example.contracts.orders;

option java_package = "com.example.contracts.orders";
option java_outer_classname = "OrderCreatedProto";
option java_multiple_files = true;

// v1: original OrderCreated — fields 1-7 only.
// Schema-registration use only (src/test/resources; never compiled by protoc).
// v2 in src/main/resources adds optional promo_code at field 8.
message OrderCreated {
  string order_id     = 1;
  string customer_id  = 2;
  string product_id   = 3;
  int32  quantity     = 4;
  double total_amount = 5;
  string currency     = 6;
  string created_at   = 7;
}
